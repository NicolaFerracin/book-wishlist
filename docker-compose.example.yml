services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      PORT: 3001
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:3001:3001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - web
